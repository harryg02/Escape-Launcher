name: Release

on:
  push:
    tags:
      - 'v*'
  # Allows you to (re)build a release for an existing tag from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v3.0-ordered.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build FOSS Release APK and publish
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      # 1. Check out the code at the tag being released
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # 2. Set up Java 21 (the Gradle daemon JVM in gradle/gradle-daemon-jvm.properties)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Make the Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the FOSS release APK (signed with the debug signing config, see app/build.gradle.kts)
      - name: Build with Gradle
        run: ./gradlew assembleFossRelease

      # 5. Rename the APK so the tag is in the filename
      - name: Rename APK
        run: |
          apk=$(find app/build/outputs/apk/foss/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          mv "$apk" "Escape-Launcher-Foss-$TAG.apk"

      # 6. Create the GitHub Release with the APK attached (tags with a hyphen are prereleases)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" "Escape-Launcher-Foss-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
