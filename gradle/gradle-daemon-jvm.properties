# Daemon JVM criteria: any installed JDK 21, from any vendor.
# No toolchainVendor or toolchainUrl entries on purpose: updateDaemonJvm pins
# foojay package IDs, and once foojay drops one every build that needs a
# download fails. CI installs JDK 21 with actions/setup-java; Android Studio
# provides its bundled JBR 21. Don't regenerate this with updateDaemonJvm.
toolchainVersion=21
